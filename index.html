<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room with breathing curtain</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }


    /* === FEATURE 3: COLOUR GRADE — adjust these values to tune the warmth === */
    /* To disable: comment out the four grade lines in the filter below        */
    :root {
      --grade-brightness: 1.03;
      --grade-contrast: 1.05;
      --grade-saturate: 0.85;
      --grade-sepia: 0.1;
    }


    /* =============================================
       SCENE LAYERS — back to front:
         0. view (video)
         1. room (PNG with transparent windows)
         2. curtains (animated via curtains.js)
         3. plant (PNG with transparency)
         4. chair (PNG with transparency)
       ============================================= */

    #scene-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      /* The filter chain. Each feature is a separate line — comment out
         individual lines to disable that feature without touching the others. */
      filter:
        url(#boil-filter)                        /* FEATURE 4: BOIL — remove this line to disable */
        brightness(var(--grade-brightness))       /* FEATURE 3: COLOUR GRADE — remove these four  */
        contrast(var(--grade-contrast))           /*   lines to disable the colour grade           */
        saturate(var(--grade-saturate))
        sepia(var(--grade-sepia));

      will-change: filter;
    }

    /* Layer 0 (furthest back): view through the windows */
    #view-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* Layer 1: room with transparent windows — view shows through */
    #room-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #room-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Layer 2 (middle): curtains.js WebGL canvas */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* the plane source image — hidden from layout, used as a texture */
    .curtain-plane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .curtain-plane img {
      display: none;
    }

    /* Layer 3: plant */
    #plant-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    #plant-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Layer 4 (foreground): chair */
    #chair-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    #chair-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }


    /* =============================================
       PAINTERLY OVERLAYS (each independently removable)
       ============================================= */

    /* === FEATURE 1: VIGNETTE — comment out this section to disable === */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 45%,
        rgba(35, 25, 18, 0.12) 65%,
        rgba(35, 25, 18, 0.35) 100%
      );
    }

    /* === FEATURE 2: PAPER GRAIN — comment out this section to disable === */
    #paper-grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 11;
      pointer-events: none;
      opacity: 0.04;
    }
  </style>
</head>
<body>

  <!-- === FEATURE 4: BOIL — SVG displacement filter === -->
  <svg style="position:absolute; width:0; height:0; pointer-events:none;">
    <defs>
      <filter id="boil-filter" x="-5%" y="-5%" width="110%" height="110%"
              color-interpolation-filters="sRGB">
        <feTurbulence id="boil-turbulence"
                      type="turbulence"
                      baseFrequency="0.02"
                      numOctaves="2"
                      seed="1"
                      result="noise"/>
        <feDisplacementMap id="boil-displacement"
                           in="SourceGraphic"
                           in2="noise"
                           scale="3"
                           xChannelSelector="R"
                           yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>


  <!-- Scene wrapper: holds all four scene layers. Filter chain applied here. -->
  <div id="scene-wrapper">

    <!-- Layer 0: view through the windows (video) -->
    <video id="view-layer" autoplay loop muted playsinline>
      <source src="images/view.mp4" type="video/mp4">
    </video>

    <!-- Layer 1: room with transparent windows -->
    <div id="room-layer">
      <img src="images/room.png" alt="">
    </div>

    <!-- Layer 2: canvas curtains.js draws into -->
    <div id="canvas"></div>

    <!-- the curtain texture source -->
    <div class="curtain-plane">
      <img src="images/curtains.png" alt="curtain" data-sampler="planeTexture">
    </div>

    <!-- Layer 3: plant -->
    <div id="plant-layer">
      <img src="images/plant.png" alt="">
    </div>

    <!-- Layer 4: chair in front of everything -->
    <div id="chair-layer">
      <img src="images/chair.png" alt="">
    </div>

  </div>


  <!-- === FEATURE 1: VIGNETTE === -->
  <div id="vignette"></div>

  <!-- === FEATURE 2: PAPER GRAIN === -->
  <div id="paper-grain"></div>

  <!-- === FEATURE 5: AMBIENT SOUND — comment out to disable ===
       Loops continuously. Browsers block unmuted autoplay, so playback
       starts on first click/tap anywhere on the page. -->
  <audio id="ambient-sound" loop preload="auto">
    <source src="audio/ambient.mp3" type="audio/mpeg">
  </audio>


  <!-- vertex shader: slow gentle horizontal wave, anchored at the top -->
  <script id="curtain-vs" type="x-shader/x-vertex">
    precision mediump float;

    attribute vec3 aVertexPosition;
    attribute vec2 aTextureCoord;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;

    uniform float uTime;

    varying vec3 vVertexPosition;
    varying vec2 vTextureCoord;

    void main() {
      vec3 vertexPosition = aVertexPosition;

      float hangFactor = (1.0 - vertexPosition.y) * 0.5;

      vertexPosition.x += sin(vertexPosition.y * 3.0 + uTime * 0.015) * 0.025 * hangFactor;

      gl_Position = uPMatrix * uMVMatrix * vec4(vertexPosition, 1.0);

      vTextureCoord = aTextureCoord;
      vVertexPosition = vertexPosition;
    }
  </script>

  <!-- fragment shader: sample the texture, preserve its transparency -->
  <script id="curtain-fs" type="x-shader/x-fragment">
    precision mediump float;

    varying vec3 vVertexPosition;
    varying vec2 vTextureCoord;

    uniform sampler2D planeTexture;

    void main() {
      gl_FragColor = texture2D(planeTexture, vTextureCoord);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/curtainsjs@8.1.6/dist/curtains.umd.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      /* =============================================
         CURTAIN ANIMATION (unchanged)
         ============================================= */

      var curtains = new Curtains({
        container: "canvas",
        alpha: true,
      });

      var planeElement = document.querySelector(".curtain-plane");

      var params = {
        vertexShaderID: "curtain-vs",
        fragmentShaderID: "curtain-fs",
        widthSegments: 20,
        heightSegments: 20,
        uniforms: {
          time: {
            name: "uTime",
            type: "1f",
            value: 0,
          },
        },
      };

      var plane = new Plane(curtains, planeElement, params);

      plane.onRender(function () {
        plane.uniforms.time.value++;
      });


      /* === FEATURE 2: PAPER GRAIN — generate a tileable noise texture === */

      function generateGrainTexture() {
        var size = 200;
        var grainCanvas = document.createElement("canvas");
        grainCanvas.width = size;
        grainCanvas.height = size;
        var ctx = grainCanvas.getContext("2d");
        var imageData = ctx.createImageData(size, size);
        var pixels = imageData.data;

        for (var i = 0; i < pixels.length; i += 4) {
          var value = Math.random() * 255;
          pixels[i]     = value;
          pixels[i + 1] = value;
          pixels[i + 2] = value;
          pixels[i + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
        return grainCanvas.toDataURL();
      }

      var grainElement = document.getElementById("paper-grain");
      if (grainElement) {
        grainElement.style.backgroundImage = "url(" + generateGrainTexture() + ")";
        grainElement.style.backgroundRepeat = "repeat";
      }


      /* === FEATURE 4: BOIL — animate the SVG displacement filter ===       */
      /*                                                                      */
      /* TUNING — adjust these three values:                                  */
      /*   boilScale      — pixel displacement (lower = subtler)              */
      /*   boilIntervalMs — milliseconds between redraws (higher = calmer)    */
      /*   boilFrequency  — displacement grain (lower = broader warps)        */

      var boilScale       = 0;
      var boilIntervalMs  = 0;
      var boilFrequency   = 0;

      var turbulenceEl   = document.getElementById("boil-turbulence");
      var displacementEl = document.getElementById("boil-displacement");

      if (turbulenceEl && displacementEl) {
        turbulenceEl.setAttribute("baseFrequency", boilFrequency);
        displacementEl.setAttribute("scale", boilScale);

        var boilSeed = 1;
        setInterval(function () {
          boilSeed = boilSeed + 1;
          if (boilSeed > 1000) boilSeed = 1;
          turbulenceEl.setAttribute("seed", boilSeed);
        }, boilIntervalMs);
      }


      /* === FEATURE 5: AMBIENT SOUND — start on first interaction ===        */
      /* Browsers block unmuted audio autoplay. This starts the sound on       */
      /* the first click or tap anywhere, then removes the listener.           */
      /* To disable: comment out this block AND the <audio> element above.     */
      /* To adjust volume: change ambientVolume (0.0 silent — 1.0 full).       */

      var ambientVolume = 0.3;
      var ambientSound  = document.getElementById("ambient-sound");

      if (ambientSound) {
        ambientSound.volume = ambientVolume;

        function startAmbient() {
          ambientSound.play();
          document.removeEventListener("click", startAmbient);
          document.removeEventListener("touchstart", startAmbient);
        }

        document.addEventListener("click", startAmbient);
        document.addEventListener("touchstart", startAmbient);
      }


      /* === FEATURE 6: PARALLAX — mouse-tracking depth ===                  */
      /* To disable: comment out this entire block.                           */
      /* Each layer shifts slightly as the mouse moves. Far layers move       */
      /* less, near layers move more — the brain reads it as depth.           */
      /*                                                                      */
      /* TUNING:                                                              */
      /*   parallaxMaxShift — max pixels any layer moves (lower = subtler)    */
      /*   parallaxSmoothing — how fast layers glide to position              */
      /*                       (lower = slower/dreamier, higher = snappier)   */
      /*   depth per layer — how much each layer moves relative to others     */

      var parallaxMaxShift  = 10;
      var parallaxSmoothing = 0.01;

      var parallaxLayers = [
        { el: document.getElementById("view-layer"),  depth: 0.2 },
        { el: document.getElementById("room-layer"),  depth: 0.5 },
        { el: document.getElementById("canvas"),      depth: 0.8 },
        { el: document.getElementById("plant-layer"), depth: 1.5 },
        { el: document.getElementById("chair-layer"), depth: 1.2 },
      ];

      var mouseX   = 0.5;
      var mouseY   = 0.5;
      var smoothX  = 0.5;
      var smoothY  = 0.5;

      document.addEventListener("mousemove", function (e) {
        mouseX = e.clientX / window.innerWidth;
        mouseY = e.clientY / window.innerHeight;
      });

      function updateParallax() {
        smoothX += (mouseX - smoothX) * parallaxSmoothing;
        smoothY += (mouseY - smoothY) * parallaxSmoothing;

        var offsetX = (smoothX - 0.5) * 2;
        var offsetY = (smoothY - 0.5) * 2;

        for (var i = 0; i < parallaxLayers.length; i++) {
          var layer = parallaxLayers[i];
          if (!layer.el) continue;

          var x = -offsetX * layer.depth * parallaxMaxShift;
          var y = -offsetY * layer.depth * parallaxMaxShift * 0.5;

          layer.el.style.transform =
            "scale(1.05) translate(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px)";
        }

        requestAnimationFrame(updateParallax);
      }

      requestAnimationFrame(updateParallax);

    });
  </script>

</body>
</html>
