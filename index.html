<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room with breathing curtain</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }


    /* === FEATURE 3: COLOUR GRADE — adjust these values to tune the warmth === */
    /* To disable: comment out the filter line inside #scene-wrapper below     */
    :root {
      --grade-brightness: 1.03;
      --grade-contrast: 1.05;
      --grade-saturate: 0.85;
      --grade-sepia: 0.1;
    }


    /* =============================================
       SCENE LAYERS (room, curtain, chair)
       ============================================= */

    /* The wrapper holds all scene layers. The colour grade filter lives here. */
    #scene-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      /* Layer 1 (furthest back): empty room — walls, windows, floor */
      background-image: url("images/empty-room-window.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* === FEATURE 3: comment out this line to disable the colour grade === */
      filter:
        brightness(var(--grade-brightness))
        contrast(var(--grade-contrast))
        saturate(var(--grade-saturate))
        sepia(var(--grade-sepia));
    }

    /* Layer 2 (middle): curtains.js WebGL canvas */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* the plane source image — hidden from layout, used as a texture */
    .curtain-plane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .curtain-plane img {
      display: none;
    }

    /* Layer 3 (foreground): chair, sitting in front of the curtain */
    #chair-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #chair-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }


    /* =============================================
       PAINTERLY OVERLAYS (each independently removable)
       ============================================= */

    /* === FEATURE 1: VIGNETTE — comment out this section to disable ===
       Warm dark edges, transparent centre.
       Adjust the rgba alpha values to control strength.
       The middle percentage (60%) controls how far in the shadow reaches. */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 45%,
        rgba(35, 25, 18, 0.12) 65%,
        rgba(35, 25, 18, 0.35) 100%
      );
    }

    /* === FEATURE 2: PAPER GRAIN — comment out this section to disable ===
       Static noise texture tiled across the viewport.
       Adjust opacity to control visibility — should be felt, not seen.
       The background-image is set by JavaScript on load. */
    #paper-grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 11;
      pointer-events: none;
      opacity: 0.04;
    }

    /* === FEATURE 4: ANIMATED GRAIN (BOIL) — comment out this section to disable ===
       Slowly shifting noise that makes the scene feel alive.
       Adjust opacity to control visibility.
       The canvas renders at low resolution for softness and performance. */
    #boil {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 12;
      pointer-events: none;
      opacity: 0.03;
    }
  </style>
</head>
<body>

  <!-- Scene wrapper: holds room/curtain/chair. Colour grade filter applied here. -->
  <div id="scene-wrapper">

    <!-- Layer 2: canvas curtains.js draws into -->
    <div id="canvas"></div>

    <!-- the curtain texture source -->
    <div class="curtain-plane">
      <img src="images/curtain.png" alt="curtain" data-sampler="planeTexture">
    </div>

    <!-- Layer 3: chair in front of everything -->
    <div id="chair-layer">
      <img src="images/chair-removebg-preview.png" alt="">
    </div>

  </div>


  <!-- === FEATURE 1: VIGNETTE === -->
  <div id="vignette"></div>

  <!-- === FEATURE 2: PAPER GRAIN === -->
  <div id="paper-grain"></div>

  <!-- === FEATURE 4: ANIMATED GRAIN (BOIL) === -->
  <canvas id="boil"></canvas>


  <!-- vertex shader: slow gentle horizontal wave, anchored at the top -->
  <script id="curtain-vs" type="x-shader/x-vertex">
    precision mediump float;

    attribute vec3 aVertexPosition;
    attribute vec2 aTextureCoord;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;

    uniform float uTime;

    varying vec3 vVertexPosition;
    varying vec2 vTextureCoord;

    void main() {
      vec3 vertexPosition = aVertexPosition;

      // 0.0 at the top of the plane, 1.0 at the bottom — fabric hangs from a fixed rod
      float hangFactor = (1.0 - vertexPosition.y) * 0.5;

      // slow, subtle horizontal sway
      vertexPosition.x += sin(vertexPosition.y * 3.0 + uTime * 0.015) * 0.025 * hangFactor;

      gl_Position = uPMatrix * uMVMatrix * vec4(vertexPosition, 1.0);

      vTextureCoord = aTextureCoord;
      vVertexPosition = vertexPosition;
    }
  </script>

  <!-- fragment shader: sample the texture, preserve its transparency -->
  <script id="curtain-fs" type="x-shader/x-fragment">
    precision mediump float;

    varying vec3 vVertexPosition;
    varying vec2 vTextureCoord;

    uniform sampler2D planeTexture;

    void main() {
      gl_FragColor = texture2D(planeTexture, vTextureCoord);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/curtainsjs@8.1.6/dist/curtains.umd.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      /* =============================================
         CURTAIN ANIMATION (unchanged)
         ============================================= */

      const { Curtains, Plane } = window;

      // alpha: true keeps the canvas transparent so the room shows through
      const curtains = new Curtains({
        container: "canvas",
        alpha: true,
      });

      const planeElement = document.querySelector(".curtain-plane");

      const params = {
        vertexShaderID: "curtain-vs",
        fragmentShaderID: "curtain-fs",
        widthSegments: 20,
        heightSegments: 20,
        uniforms: {
          time: {
            name: "uTime",
            type: "1f",
            value: 0,
          },
        },
      };

      const plane = new Plane(curtains, planeElement, params);

      plane.onRender(function () {
        plane.uniforms.time.value++;
      });


      /* === FEATURE 2: PAPER GRAIN — generate a tileable noise texture === */
      /* To disable: comment out this block AND the #paper-grain CSS above  */

      function generateGrainTexture() {
        var size = 200;
        var grainCanvas = document.createElement("canvas");
        grainCanvas.width = size;
        grainCanvas.height = size;
        var ctx = grainCanvas.getContext("2d");
        var imageData = ctx.createImageData(size, size);
        var pixels = imageData.data;

        for (var i = 0; i < pixels.length; i += 4) {
          var value = Math.random() * 255;
          pixels[i]     = value;
          pixels[i + 1] = value;
          pixels[i + 2] = value;
          pixels[i + 3] = 255;
        }

        ctx.putImageData(imageData, 0, 0);
        return grainCanvas.toDataURL();
      }

      var grainElement = document.getElementById("paper-grain");
      if (grainElement) {
        grainElement.style.backgroundImage = "url(" + generateGrainTexture() + ")";
        grainElement.style.backgroundRepeat = "repeat";
      }


      /* === FEATURE 4: ANIMATED GRAIN (BOIL) — slowly shifting noise ===     */
      /* To disable: comment out this block AND the #boil CSS above            */
      /* The canvas renders at 1/4 resolution for softness and performance.    */
      /* Update rate controls the breathing speed — higher = slower = calmer.  */

      var boilCanvas = document.getElementById("boil");
      if (boilCanvas) {
        var boilCtx = boilCanvas.getContext("2d");
        var boilUpdateMs = 150;  // milliseconds between frames — increase for calmer

        function resizeBoil() {
          boilCanvas.width  = Math.ceil(window.innerWidth / 4);
          boilCanvas.height = Math.ceil(window.innerHeight / 4);
        }

        function drawBoil() {
          var w = boilCanvas.width;
          var h = boilCanvas.height;
          var imageData = boilCtx.createImageData(w, h);
          var pixels = imageData.data;

          for (var i = 0; i < pixels.length; i += 4) {
            var value = Math.random() * 255;
            pixels[i]     = value;
            pixels[i + 1] = value;
            pixels[i + 2] = value;
            pixels[i + 3] = 255;
          }

          boilCtx.putImageData(imageData, 0, 0);
        }

        resizeBoil();
        drawBoil();
        window.addEventListener("resize", resizeBoil);
        setInterval(drawBoil, boilUpdateMs);
      }

    });
  </script>

</body>
</html>
